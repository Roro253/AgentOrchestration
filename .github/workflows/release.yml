name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on:
      - self-hosted
      - linux
      - x64
      - agent-orchestration-build
    env:
      AO_RUNNER_LABELS: self-hosted,linux,x64,agent-orchestration-build
      AO_REQUIRED_RUNNER_LABELS: self-hosted,linux,x64,agent-orchestration-build
      AO_APPROVED_RUNNER_LABELS: self-hosted,linux,x64,agent-orchestration-build
      AO_APPROVED_RUNNER_IMAGE_DIGESTS: ${{ vars.AO_APPROVED_RUNNER_IMAGE_DIGESTS }}
      AO_MAX_RUNNER_IMAGE_AGE_DAYS: ${{ vars.AO_MAX_RUNNER_IMAGE_AGE_DAYS }}

    steps:
      - uses: actions/checkout@v4

      - name: Runner provenance preflight
        run: python3 scripts/validate_runner_provenance.py --strict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build
